<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>长夜守望</title>
  <link rel="icon" href="art/watch-seal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=card-layout-1">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 战斗内 HUD -->
  <div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div><span id="lvl">修为 1</span></div>
    <div class="watch-time"><span data-icon="moon"></span><div><small>距黎明</small><b id="timer">15:00</b></div></div>
    <div id="stats">
      <span><span data-icon="kills"></span><span class="sr-only">击杀：</span><b id="kills">0</b></span>
      <span><span data-icon="coin"></span><span class="sr-only">金币：</span><b id="coins">0</b></span>
    </div>
    <div id="slots"><div id="wslots"></div><div id="pslots"></div></div>
    <div id="hudBtns">
      <button id="btnMute" class="icon-button" aria-label="静音"></button>
      <button id="btnPause" class="icon-button" aria-label="暂停" data-icon="pause"></button>
    </div>
    <div id="bossbar" class="hidden"><span>夜魇</span><div><div id="bossfill"></div></div></div>
    <div id="banner"></div>
  </div>

  <!-- 虚拟摇杆 -->
  <div id="joy" class="hidden"><div id="joyKnob"></div></div>

  <!-- 主菜单 -->
  <main id="menu" class="overlay" aria-labelledby="gameTitle">
    <div class="watch-book">
      <header class="watch-cover">
        <div class="cover-title">
          <span class="chapter">荒原夜巡录</span>
          <h1 id="gameTitle">长夜守望</h1>
          <img class="cover-seal" src="art/watch-seal.svg" alt="" width="38" height="38">
          <p>提灯入荒原，守过十五分钟，直到天明。</p>
        </div>
      </header>
      <div class="watch-roster">
        <div class="roster-head">
          <div class="chapter">守夜名册</div>
          <h2 id="rosterTitle">择一人，入夜</h2>
          <dl class="ledger">
            <div><dt><span data-icon="coin"></span> 金币</dt><dd id="menuCoins">0</dd></div>
            <div><dt>最佳守夜</dt><dd id="menuBest">--:--</dd></div>
            <div><dt>守到天明</dt><dd id="menuWins">0</dd></div>
          </dl>
        </div>
        <div id="charList" class="chars" role="group" aria-labelledby="rosterTitle"></div>
        <p id="charNotice" class="char-notice" role="status"></p>
        <div class="roster-actions">
          <button id="btnStart" class="primary"><span data-icon="lantern"></span> 开始守夜</button>
          <button id="btnShop">永久强化</button>
          <button id="btnMute2" class="icon-button" aria-label="静音"></button>
        </div>
        <p class="hint">方向键 / WASD 移动 · 触屏拖动 · 自动攻击 · Esc 暂停</p>
      </div>
    </div>
  </main>

  <!-- 战斗开场 -->
  <section id="intro" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="intro-card">
      <div class="intro-art" aria-hidden="true">
        <div class="intro-medallion"></div>
        <div id="introPortrait" class="intro-portrait"></div>
        <span class="intro-art-note">长夜守望</span>
      </div>
      <div class="intro-copy">
        <div class="intro-stamp" aria-hidden="true">入<br>阵</div>
        <p class="chapter">点灯入阵</p>
        <h2 id="introTitle"><span id="introEpithet"></span> <b id="introName"></b></h2>
        <div class="intro-weapon">
          <span id="introWeaponIcon" class="intro-weapon-icon"></span>
          <span><small>初始武器</small><strong id="introWeaponName"></strong></span>
        </div>
        <button id="btnIntroSkip" class="intro-skip">跳过开场 <kbd>Esc</kbd></button>
      </div>
      <div class="intro-progress" aria-hidden="true"></div>
    </div>
  </section>

  <!-- 永久强化 -->
  <section id="shop" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
    <div class="panel">
      <p class="chapter">砺器册</p>
      <h2 id="shopTitle">永久强化</h2>
      <div class="wallet"><span data-icon="coin"></span> 现有金币 <b id="shopCoins">0</b></div>
      <div id="shopList"></div>
      <div class="row"><button id="btnShopBack">返回</button></div>
    </div>
  </section>

  <!-- 升级选卡 -->
  <section id="levelup" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="lvTitle">
    <div class="panel wide">
      <p class="chapter">择符</p>
      <h2 id="lvTitle">修为精进</h2>
      <div id="cards" class="cards"></div>
      <div class="row"><button id="btnReroll"><span data-icon="reroll"></span> <span id="rerollLabel">重掷</span></button></div>
    </div>
  </section>

  <!-- 宝箱 -->
  <section id="chest" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="chestTitle">
    <div class="panel wide">
      <p class="chapter">启匣</p>
      <h2 id="chestTitle">发现宝箱</h2>
      <div class="wallet"><span data-icon="coin"></span> 金币 <b id="chestCoins">+0</b></div>
      <div id="chestCards" class="cards"></div>
      <div class="row"><button id="btnChestOk" class="primary">收下</button></div>
    </div>
  </section>

  <!-- 暂停 -->
  <section id="pause" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
    <div class="panel">
      <p class="chapter">整备</p>
      <h2 id="pauseTitle">巡夜暂停</h2>
      <div id="pauseBuild"></div>
      <div class="row">
        <button id="btnResume" class="primary">继续</button>
        <button id="btnQuit">放弃本局</button>
      </div>
    </div>
  </section>

  <!-- 结算 -->
  <section id="result" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="resTitle">
    <div class="panel">
      <p class="chapter">守夜纪事</p>
      <h2 id="resTitle"></h2>
      <p class="sub" id="resSub"></p>
      <div id="resStats" class="stats"></div>
      <ul id="resDmg" class="dmg"></ul>
      <div class="row">
        <button id="btnRetry" class="primary">再来一局</button>
        <button id="btnMenu">返回主菜单</button>
      </div>
    </div>
  </section>

  <script src="js/config.js?v=xiaoxiao-1"></script>
  <script src="js/utils.js"></script>
  <script src="js/terrain.js?v=light-pools-1"></script>
  <script src="js/environment.js?v=light-pools-1"></script>
  <script src="js/weapons.js?v=xiaoxiao-1"></script>
  <script src="js/core.js?v=weather-1"></script>
  <script src="js/music.js"></script>
  <script src="js/audio.js?v=weather-1"></script>
  <script src="js/echo-figure.js?v=kaixin-lamp-1"></script>
  <script src="js/xiaoxiao-art.js?v=weather-1"></script>
  <script src="js/food-art.js"></script>
  <script src="js/terrain-art.js?v=light-pools-1"></script>
  <script src="js/environment-art.js?v=light-pools-1"></script>
  <script src="js/wardrobe.js?v=xiaoxiao-1"></script>
  <script src="js/render.js?v=light-pools-preview-1"></script>
  <script src="js/icons.js?v=xiaoxiao-1"></script>
  <script src="js/ui.js?v=card-layout-1"></script>
  <script src="js/main.js?v=night-music-1"></script>
</body>
</html>
